<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- 文字化けを防ぐ設定 -->
    <meta charset="UTF-8">

    <!-- スマホでも画面幅に合わせて表示する設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザのタブに表示されるタイトル -->
    <title>ToDoカレンダー</title>

    <!-- FullCalendarの見た目を読み込む -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">

    <!-- FullCalendarの機能を読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>

<body>
    <!-- 画面上のタイトル -->
    <h1>ToDoカレンダー</h1>

    <!-- ここにカレンダーを表示する -->
    <div id="calendar"></div>

    <script>
        // HTMLの読み込みが終わってから中の処理を実行する
        document.addEventListener("DOMContentLoaded", function () {

            // id="calendar" の場所を取得する
            const calendarEl = document.getElementById("calendar");

            // FullCalendarを作成する
            const calendar = new FullCalendar.Calendar(calendarEl, {

                // 最初に月表示で開く
                initialView: "dayGridMonth",

                // Flaskから渡されたSupabaseのToDoデータをカレンダーに入れる
                events: {{ events | tojson }},

                // 予定の表示内容を自分でカスタムする
                eventContent: function(info) {

                    // 開始日を取得する
                    const startDate = info.event.start.toLocaleDateString("ja-JP");

                    // 終了日を取得する
                    const endDate = info.event.end.toLocaleDateString("ja-JP");

                    // 開始時間を「10:00」の形にする
                    const startTime = info.event.start.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                    // 終了時間を「12:00」の形にする
                    const endTime = info.event.end.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

                    // カレンダーの中に表示するHTMLを作る
                    return {
                        html:
                            "<div style='background:" + info.event.backgroundColor + "; color:" + info.event.textColor + "; padding:4px; border-radius:4px;'>" +
                                info.event.title +
                                "<br>" +
                                startDate + "〜" + endDate +
                                "<br>" +
                                startTime + "〜" + endTime +
                                "<br>担当：" +
                                info.event.extendedProps.person +
                            "</div>"
                    };
                }
            });

            // カレンダーを画面に表示する
            calendar.render();
        });
    </script>
</body>
</html>
